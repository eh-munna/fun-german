<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      text {
        fill: #FFFFFF;
      }
      .favicon-f {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 80px;
        font-weight: 700;
      }
      .umlaut-dots {
        fill: #FFFFFF;
      }
      .line {
        stroke: #FFFFFF;
        stroke-width: 3;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- Dark background for contrast -->
  <rect width="128" height="128" fill="#2B5876"/>

  <!-- "F" letterform -->
  <text x="12" y="85" class="favicon-f">F</text>
  
  <!-- Umlaut dots -->
  <circle cx="40" cy="18" r="5.5" class="umlaut-dots"/>
  <circle cx="58" cy="18" r="5.5" class="umlaut-dots"/>
  
  <!-- Accent line -->
  <line x1="12" y1="95" x2="60" y2="95" class="line"/>
</svg>
