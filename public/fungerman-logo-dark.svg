<svg width="300" height="60" viewBox="0 0 300 60" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      text {
        fill: #EEF2F7;
      }
      .logo-fun {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 28px;
        font-weight: 700;
      }
      .logo-german {
        font-family: 'Inter', 'Segoe UI', sans-serif;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
      .underline {
        stroke: #EEF2F7;
        stroke-width: 2;
        stroke-linecap: round;
      }
      .umlaut {
        fill: #EEF2F7;
      }
    </style>
  </defs>

  <!-- "Fun" text -->
  <text x="0" y="28" class="logo-fun">Fun</text>
  
  <!-- Umlaut dots above "u" -->
  <circle cx="24" cy="6" r="3.5" class="umlaut"/>
  <circle cx="36" cy="6" r="3.5" class="umlaut"/>
  
  <!-- Underline under Fun -->
  <line x1="0" y1="34" x2="42" y2="34" class="underline"/>

  <!-- "German" text below -->
  <text x="0" y="52" class="logo-german">German</text>
</svg>
