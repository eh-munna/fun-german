<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      text {
        fill: #FFFFFF;
      }
      .favicon-f {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 80px;
        font-weight: 700;
      }
      .umlaut-dots {
        fill: #FFFFFF;
      }
      .line {
        stroke: #FFFFFF;
        stroke-width: 3;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- Full round circle background -->
  <circle cx="64" cy="64" r="64" fill="#111923"/>

  <!-- "F" letterform - centered -->
  <text x="38" y="85" class="favicon-f">F</text>
  
  <!-- Umlaut dots - centered -->
  <circle cx="56" cy="18" r="5.5" class="umlaut-dots"/>
  <circle cx="74" cy="18" r="5.5" class="umlaut-dots"/>
  
  <!-- Accent line - centered -->
  <line x1="38" y1="95" x2="78" y2="95" class="line"/>
</svg>
