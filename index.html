<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon - default -->
    <link rel="icon" type="image/svg+xml" href="/fungerman-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Open Graph metadata -->
    <meta property="og:title" content="FunGerman – Learn German in a fun way" />
    <meta
      property="og:description"
      content="German learning platform with interactive vocabulary, flashcards, grammar exercises, and more. A1–B1 levels."
    />
    <meta property="og:url" content="https://fungerman.de" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://fungerman.de/og-image.png" />
    <meta property="og:image:alt" content="FunGerman logo" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="FunGerman – Learn German in a fun way"
    />
    <meta
      name="twitter:description"
      content="German learning platform with interactive vocabulary, flashcards, grammar exercises, and more. A1–B1 levels."
    />
    <meta name="twitter:image" content="https://fungerman.de/og-image.png" />

    <!-- Standard meta description -->
    <meta
      name="description"
      content="German learning platform with interactive vocabulary, flashcards, grammar exercises, and more. A1–B1 levels."
    />

    <title>FunGerman – Learn German in a fun way</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&display=swap"
    />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      try {
        const saved = localStorage.getItem('theme');
        const dark = saved
          ? saved === 'dark'
          : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
